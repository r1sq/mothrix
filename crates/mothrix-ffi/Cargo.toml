# SPDX-License-Identifier: MPL-2.0
[package]
name = "mothrix-ffi"
description = "mothrix-core for the iOS app: a view and its JSON, through UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "mothrix_ffi"
# staticlib: linked into the iOS app; cdylib: what uniffi-bindgen reads
# the interface from (on any system).
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
mothrix-core.workspace = true
matrix-sdk.workspace = true
serde.workspace = true
base64.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi = { version = "0.32", features = ["cli"] }

[dev-dependencies]
toml.workspace = true
