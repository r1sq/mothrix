[package]
name = "mothrix-tui"
description = "A mouse-friendly terminal Matrix client with a room sidebar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mothrix"
path = "src/main.rs"

[dependencies]
mothrix-core.workspace = true
matrix-sdk.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
dirs.workspace = true
unicode-width.workspace = true
emojis.workspace = true
textwrap.workspace = true
chrono.workspace = true
image.workspace = true
color_quant.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
