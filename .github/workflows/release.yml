# SPDX-License-Identifier: MPL-2.0
#
# A release of the terminal client, when a tag `vX.Y.Z` naming Cargo.toml's
# version is pushed: the Linux binary and .deb, the Windows .exe
# (cross-compiled with MinGW, as it is tried), signed for the self-updater
# (crates/mothrix-core/src/update.rs) and published. Every installed copy
# will offer it, so signing runs in the "release" environment: add required
# reviewers there (Settings > Environments) to make publishing take an
# approval. The iPhone app goes to TestFlight from the Mac
# (.forgejo/workflows/ios.yml).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  # Built on the oldest Ubuntu supported: the Linux binary runs on any
  # distribution with at least its glibc. No secrets here, and no cache:
  # nothing from an earlier run goes into a signed build.
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      # With the tags: the version shown is the bare release's only when
      # the build sees its tag (crates/build-version.rs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust (rust-toolchain.toml) and the Windows target
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-gnu
      - name: What the builds use
        run: sudo apt-get update && sudo apt-get install -y cmake clang mingw-w64

      - name: Linux
        run: cargo build --release --locked
      - name: The tag is Cargo.toml's version
        run: |
          shown=$(target/release/mothrix --version)
          echo "$shown"
          test "$shown" = "mothrix ${GITHUB_REF_NAME#v}" || {
            echo "::error::the tag $GITHUB_REF_NAME does not name this build's version ($shown)"
            exit 1
          }
      - name: Windows
        run: cargo build --release --locked -p mothrix-tui --target x86_64-pc-windows-gnu
      - name: The release's files
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          cp target/release/mothrix "dist/mothrix-$version-x86_64-linux"
          cp target/x86_64-pc-windows-gnu/release/mothrix.exe "dist/mothrix-$version-x86_64-windows.exe"
      # The package's mothrix leaves updating to the package manager; only
      # the terminal crate is built again for it.
      - name: Debian package
        run: |
          MOTHRIX_PACKAGED=1 cargo build --release --locked -p mothrix-tui
          packaging/build-deb.sh
          cp "target/mothrix_${GITHUB_REF_NAME#v}_amd64.deb" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # to create the release, and nothing else
    steps:
      # For dev/release, which checks the signature against the public key
      # of this tag's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Built before the key is in the environment: the build scripts and
      # macros of the signing tool's dependencies never see it.
      - name: Build the signing tool
        run: cargo build --release --locked -p mothrix-release
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: target/release/mothrix-release sign "${GITHUB_REF_NAME#v}" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "mothrix ${GITHUB_REF_NAME#v}" \
            --notes "The terminal client for Linux (binary and .deb, x86_64) and Windows (x86_64). The binary and the .exe update themselves (/update, or mothrix update); the .deb leaves that to your package manager. SHA256SUMS lists the files' checksums; release.json is the same list, signed. The iPhone app is on TestFlight."
